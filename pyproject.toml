[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracetape"
version = "1.1.0"
description = "Define, validate and summarize the canonical agent run tape (trace.jsonl). One tape every agent run leaves behind."
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
tracetape = "tracetape:main"

[tool.setuptools]
py-modules = ["tracetape"]
package-dir = {"" = "src"}
